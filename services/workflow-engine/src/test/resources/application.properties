spring.datasource.url=${WORKFLOW_TEST_DATABASE_URL}
spring.datasource.username=workflow
spring.datasource.password=${WORKFLOW_TEST_PASSWORD}
spring.sql.init.mode=always
flowable.database-schema-update=true
flowable.async-executor-activate=false
flowable.history-level=full
flowable.check-process-definitions=false
workflow.token=test-service-token-with-at-least-32-characters

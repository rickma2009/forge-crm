server.port=8091
spring.datasource.url=${WORKFLOW_DATABASE_URL}
spring.datasource.username=${WORKFLOW_DATABASE_USER}
spring.datasource.password=${WORKFLOW_DATABASE_PASSWORD}
spring.sql.init.mode=always
flowable.database-schema-update=${WORKFLOW_SCHEMA_UPDATE:false}
flowable.async-executor-activate=false
flowable.history-level=full
flowable.check-process-definitions=false
workflow.token=${WORKFLOW_SERVICE_TOKEN}
server.error.include-message=never
server.error.include-stacktrace=never

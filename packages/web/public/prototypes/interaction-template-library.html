<script>
const names=[['列表与检索',['查询表格列表','带表格视图的列表','卡片检索列表','分组与层级列表']],['树形联动',['树状分类明细','树节点维护','树节点与多Tab详情']],['详情与录入',['对象详情工作区','单表录入','主从单据录入','对比与版本查看']],['选择与关联',['弹窗表格单选','弹窗表格多选','弹窗树分类与表格多选','待选与已选双区选择','选择记录并补充明细']],['工作区与容器',['多页面Tab工作区','页面内多Tab工作区','抽屉查看','抽屉编辑','弹窗维护']],['流程与作业',['分步办理','审批处理','批量操作与结果反馈','导入校验与确认','异步任务与进度跟踪']],['分析与展示',['指标看板','图表与明细联动','日历与时间计划','时间线与过程记录']],['智能交互',['大模型对话页面','内容生成与采纳页面','智能建议与人工确认页面','Agent任务执行页面','Agent过程跟踪与接管页面','多Agent协作与结果汇总页面']]];
const special={
'带表格视图的列表':{summary:'上方查询条件，下方视图工具栏、记录表格和分页。',regions:['查询条件区：字段输入、重置和查询','列表工具栏：新增、视图选择、设置、记录数','网格区域：序号、语义操作图标、关键字段链接、分页'],steps:['输入条件并查询记录','切换个人视图或对象默认视图','从关键编码/名称进入详情，使用图标执行行操作'],config:['查询字段与默认条件','业务对象标识及视图配置','表格列、行操作、分页、接口与权限'],components:['RecordQueryBar','ListViewSelector','RowActionButton','BusinessDirectory'],app:['客户管理','/showcase/customers'],tags:['查询','网格','个人视图'],demo:true},
'树状分类明细':{summary:'上方通用查询，左侧多级分类树，右侧表格随节点选择刷新。',regions:['顶部查询区','左侧分类树：搜索、展开/收起','右侧记录网格：分类条件与查询条件共同生效'],steps:['选择分类节点','保留查询条件并刷新右侧记录','清除分类后恢复全量范围'],config:['树节点ID、父节点ID、名称','是否包含下级分类','固定分类过滤、列表字段和权限'],components:['RecordQueryBar','TreeWorkspace','RowActionButton'],app:['物料产品管理','/showcase/items'],tags:['树','分类联动','网格'],demo:true},
'树节点维护':{summary:'左侧树选择对象，右侧维护选定节点；支持授权的节点菜单。',regions:['左树：节点搜索与选择','节点菜单：右键和省略号一致','右侧选中节点信息与维护区'],steps:['选择节点查看信息','通过右键或省略号打开节点操作','保存后刷新节点信息'],config:['节点层级与显示字段','新增/子节点/编辑/删除的权限','内置节点保护与未保存离开确认'],components:['TreeWorkspace','TreeNodeActions'],app:['角色管理','/showcase/system/roles'],tags:['树','节点维护','右键菜单']},
'对象详情工作区':{summary:'一个白色工作区中展示对象标题、只读摘要与内容Tab。',regions:['标题区：返回、对象名称/单号、状态与操作','只读摘要：字段名与字段值','内容Tab与对应正文'],steps:['从列表关键字段打开详情','切换有权限的内容Tab','返回列表并保留列表上下文'],config:['对象名称、摘要与操作','Tab配置与内容','详情接口、权限、离开保护'],components:['DetailWorkspace','DetailHeader','DetailTabs','DetailPanel'],app:['客户管理（从记录进入详情）','/showcase/customers'],tags:['详情','多Tab','摘要']}
};
const families=names.map(([name,children],i)=>({id:'C'+String(i+1).padStart(2,'0'),name,items:children.map((name,j)=>({id:'TPL-'+String(i+1).padStart(2,'0')+'-'+String(j+1).padStart(2,'0'),name,family:i,...(special[name]||{summary:'该交互的定义、效果与接入资产待进一步提炼。',regions:[],steps:[],config:[],components:[],tags:[]})}))}));const items=families.flatMap(x=>x.items);
let active=null,selected=null,filters={q:"",category:"",status:""};const expanded=new Set(families.map(x=>x.id));const $=id=>document.getElementById(id);const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function matches(t){return (!filters.q||[t.id,t.name,t.summary,...t.tags].join(' ').toLowerCase().includes(filters.q))&&(!filters.category||families[t.family].id===filters.category)&&(!filters.status||filters.status==='pending')}
$('query-category').insertAdjacentHTML('beforeend',families.map(f=>`<option value="${f.id}">${f.name}</option>`).join(''));
function preview(t){return `<div class="preview"><div class="canvas"><div class="bar"><div class="line"></div><div class="line"></div><span class="bluebox"></span></div>${t.name.includes('Tab')||t.name.includes('详情')?'<div class="bar">基本信息　　明细　　附件</div>':'<div class="bar"><span class="bluebox"></span><div class="line"></div></div>'}<div class="mockbody">${t.name.includes('树')?'<div class="mocktree"><span></span><span></span><span></span></div>':''}<div class="mockrows">${[1,2,3].map(()=>'<div class="mockrow"><span></span><span></span><span></span></div>').join('')}</div></div></div><div class="caption">原型布局示意 · 非实际效果截图</div></div>`}
function nav(){const q=$('tree-search').value.trim().toLowerCase();const row=(id,label,level,kind,isSelected,branch,open)=>`<div class="tw-row ${isSelected?'is-selected':''}" role="treeitem" aria-level="${level}" aria-selected="${isSelected}" ${branch?`aria-expanded="${open}"`:''} tabindex="${isSelected?0:-1}" data-${kind}="${id}" style="padding-left:${(level-1)*16}px"><button class="tw-expander" tabindex="-1" ${branch?`data-expand="${id}" aria-label="${open?'收起':'展开'}${label}"`:'disabled aria-hidden="true"'}>${branch?(open?'⌄':'›'):''}</button><button class="tw-node" tabindex="-1" data-${kind}="${id}" title="${label}">${label}</button></div>`;
$('nav').innerHTML=row('all','全部模板',1,'all',!active&&!selected,false,false)+families.map(f=>{const parentHit=f.name.toLowerCase().includes(q),visible=f.items.filter(t=>!q||parentHit||[t.id,t.name].join(' ').toLowerCase().includes(q));if(!visible.length)return '';const open=!!q||expanded.has(f.id);return row(f.id,f.name,1,'family',active===f.id&&!selected,true,open)+(open?visible.map(t=>row(t.id,t.name,2,'template',selected===t.id,false,false)).join(''):'')}).join('');if(!$('nav').querySelector('[tabindex="0"]'))$('nav').querySelector('[role="treeitem"]').tabIndex=0;}
function state(){history.replaceState(null,'',selected?'#template='+selected:active?'#category='+active:'#all');nav();if(selected)detail(items.find(t=>t.id===selected));else overview()}
function overview(){const f=families.find(f=>f.id===active);const visible=(f?f.items:items).filter(matches);$('content').innerHTML=`<div class="sub"><div><div class="breadcrumb">模板库${f?' / '+f.name:''}</div><h1>${f?f.name:'全部模板'}</h1><p class="muted">${f?'点击模板查看效果、交互规则和接入方式。':'一级分类聚合模板，二级节点直接打开模板详情。'} 共 ${visible.length} 个候选模板</p></div><span class="badge">${families.length} 类 · ${items.length} 个候选模板</span></div><div class="cards">${visible.map(t=>`<button class="card" data-template="${t.id}">${t.app?preview(t):'<div class="preview empty">效果资产待建设</div>'}<div class="info"><div class="muted">${t.id}</div><h3>${t.name}</h3><p>${t.summary}</p><span class="badge ${t.app?'blue':''}">${t.app?'有参考页面 · 待提炼':'待提炼'}</span></div></button>`).join('')}</div>${!visible.length?'<div class="empty">没有匹配的模板，请调整搜索条件。</div>':''}`;}
const list=a=>a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p class="muted">待建设，尚无完整开发资产。</p>';
function prompt(t){return `请参考“${t.name}”模板（${t.id}）设计本页面。保持模板的区域划分、主要操作流程及公共组件；按本功能需求配置字段、数据接口和权限。`}
function detail(t){const f=families[t.family];$('content').innerHTML=`<div class="detail"><div class="heading"><button class="back" data-family="${f.id}">← 返回${f.name}</button><div class="breadcrumb">${f.name} / ${t.name}</div><div class="sub" style="margin:0"><div><h1>${t.name}</h1><p class="muted">${t.summary}</p></div><span class="badge blue">${t.app?'有参考页面 · 待提炼':'待提炼'}</span></div><div class="badges"><span class="badge">${t.id}</span>${t.tags.map(x=>'<span class="badge">'+x+'</span>').join('')}</div><div class="actions">${t.demo?`<a class="primary" style="padding:8px 11px;border-radius:5px" href="?demo=${t.id}" target="_blank" rel="noopener">打开交互原型 ↗</a>`:'<span class="badge">独立演示待建设</span>'}<button id="copy">复制参考指令</button></div></div><section class="section"><h2>效果预览</h2>${t.app?preview(t):'<div class="callout">尚无该模板的实际截图或独立演示。当前目录仅登记建设目标。</div>'}${t.demo?'<p class="muted">可打开本设计附带的示例交互原型；正式独立演示及可复用骨架仍待建设。</p>':''}</section><section class="section columns"><div><h2>页面结构</h2>${list(t.regions)}</div><div><h2>主要交互</h2>${list(t.steps)}</div></section><section class="section columns"><div><h2>配置内容</h2>${list(t.config)}</div><div><h2>已有组件参考</h2>${list(t.components)}<p class="muted">组件列表是现有源码参考，不代表模板骨架已提炼完成。</p></div></section><section class="section"><h2>参考指令</h2><div class="callout ref">${esc(prompt(t))}</div></section><section class="section"><h2>应用案例</h2>${t.app?`<a href="http://localhost:5173/#${t.app[1]}" target="_blank" rel="noopener">${t.app[0]} ↗</a><p class="muted">实际业务页面，需登录及相应权限；与独立示例演示分开。</p>`:'<p class="muted">尚未登记验证过的应用案例。</p>'}</section><section class="section"><h2>建设与维护</h2><p>设计版本：2026-09-28 · 首批提炼：${t.app?'是':'否'}</p><p class="muted">本原型用于确认目录与详情结构。截图、演示、代码骨架、接入说明齐备并验证后，模板才标为“可复用”。</p></section></div>`;}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.expand){const id=b.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);nav()}else if(b.dataset.template){selected=b.dataset.template;active=families[items.find(t=>t.id===selected).family].id;state();$('content').scrollTo(0,0)}else if(b.dataset.family){active=b.dataset.family;selected=null;state()}else if(b.dataset.all){active=null;selected=null;state()}else if(b.id==='copy'){try{await navigator.clipboard.writeText(prompt(items.find(t=>t.id===selected)));$('toast').textContent='参考指令已复制'}catch{$('toast').textContent='请选中下方参考指令复制'}$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}});
$('tree-search').addEventListener('input',nav);
$('query-form').addEventListener('submit',e=>{e.preventDefault();filters={q:$('search').value.trim().toLowerCase(),category:$('query-category').value,status:$('query-status').value};selected=null;active=filters.category||active;state()});
$('reset-query').onclick=()=>{$('query-form').reset();filters={q:'',category:'',status:''};selected=null;active=null;state()};
$('panel-toggle').onclick=()=>{const closed=$('shell').classList.toggle('is-collapsed');$('panel-toggle').textContent=closed?'›':'‹';$('panel-toggle').setAttribute('aria-expanded',String(!closed));$('panel-toggle').setAttribute('aria-label',closed?'展开树面板':'收起树面板')};
$('tree-width').oninput=e=>$('shell').style.setProperty('--tree-width',e.target.value+'px');
$('tree-tools').onclick=()=>{const menu=$('tree-tools-menu');menu.hidden=!menu.hidden;$('tree-tools').setAttribute('aria-expanded',String(!menu.hidden))};
$('expand-all').onclick=()=>{families.forEach(f=>expanded.add(f.id));nav()};$('collapse-all').onclick=()=>{expanded.clear();nav()};$('refresh-tree').onclick=()=>nav();
$('nav').addEventListener('keydown',e=>{const row=e.target.closest('[role="treeitem"]');if(!row)return;const rows=[...$('nav').querySelectorAll('[role="treeitem"]')];let index=rows.indexOf(row);if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();index=e.key==='Home'?0:e.key==='End'?rows.length-1:Math.max(0,Math.min(rows.length-1,index+(e.key==='ArrowDown'?1:-1)));rows.forEach(r=>r.tabIndex=-1);rows[index].tabIndex=0;rows[index].focus()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();row.querySelector('.tw-node').click()}else if(e.key==='ArrowRight'&&row.dataset.family){e.preventDefault();expanded.add(row.dataset.family);nav();$('nav').querySelector(`[data-family="${row.dataset.family}"]`).focus()}else if(e.key==='ArrowLeft'){e.preventDefault();if(row.dataset.family){expanded.delete(row.dataset.family);nav();$('nav').querySelector(`[data-family="${row.dataset.family}"]`).focus()}else if(row.dataset.template){const t=items.find(t=>t.id===row.dataset.template);$('nav').querySelector(`[data-family="${families[t.family].id}"]`).focus()}}});
const initial=location.hash.slice(1).split('=');if(initial[0]==='template'&&items.some(t=>t.id===initial[1])){selected=initial[1];active=families[items.find(t=>t.id===selected).family].id}else if(initial[0]==='category')active=initial[1];state();
window.addEventListener('hashchange',()=>{const route=location.hash.slice(1).split('=');selected=route[0]==='template'&&items.some(t=>t.id===route[1])?route[1]:null;active=selected?families[items.find(t=>t.id===selected).family].id:route[0]==='category'?route[1]:null;state()});
const demo=new URLSearchParams(location.search).get('demo');if(demo){const t=items.find(t=>t.id===demo);if(t?.demo){$('shell').style.display='none';$('query-form').style.display='none';const tree=t.name.includes('树');document.body.insertAdjacentHTML('beforeend',`<main class="demo"><header><h1>${t.name}</h1><p class="muted">示例交互原型 · 内存示例数据 · 不连接业务接口</p></header><div class="query"><input id="demoquery" class="search" style="margin:0" placeholder="搜索名称"><button id="demo-search">查询</button><button id="demo-reset">重置</button></div><div class="demogrid">${tree?'<aside class="demotree"><button data-cat="全部">全部分类</button><button data-cat="电子类">电子类</button><button data-cat="结构类">结构类</button></aside>':''}<section class="demodata"><div class="view-toolbar"><strong id="demotitle">全部记录</strong>${!tree?'<label>当前视图 <select id="demoview"><option>默认视图</option><option>精简视图</option></select></label>':''}</div><table><thead><tr><th>编码</th><th>名称</th><th class="extra">分类</th></tr></thead><tbody id="demorows"></tbody></table><p id="democount" class="muted"></p></section></div></main>`);let cat='全部';const rows=[{code:'D001',name:'控制板',category:'电子类'},{code:'D002',name:'电源板',category:'电子类'},{code:'D003',name:'外壳',category:'结构类'}];function draw(){const q=$('demoquery').value;const shown=rows.filter(r=>(cat==='全部'||r.category===cat)&&r.name.includes(q));$('demorows').innerHTML=shown.map(r=>`<tr><td>${r.code}</td><td>${r.name}</td><td class="extra">${r.category}</td></tr>`).join('');$('demotitle').textContent=cat+'记录';$('democount').textContent='共 '+shown.length+' 条';if(!tree&&$('demoview').value==='精简视图')document.querySelectorAll('.extra').forEach(x=>x.style.display='none');else document.querySelectorAll('.extra').forEach(x=>x.style.display='')}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;draw()});$('demo-search').onclick=draw;$('demo-reset').onclick=()=>{$('demoquery').value='';cat='全部';draw()};if(!tree)$('demoview').onchange=draw;draw();}}
</script></html>

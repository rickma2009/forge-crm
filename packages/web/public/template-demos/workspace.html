<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模板示例交互</title><style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;font-size:12px;color:#334155;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{cursor:pointer}button{min-height:32px;border:1px solid #d7deea;border-radius:5px;padding:5px 11px;background:white;color:inherit}button:hover{background:#eef3ff}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #3568ff;outline-offset:2px}.primary{background:#3568ff;color:white;border-color:#3568ff}.primary:hover{background:#2855db}.top{height:62px;background:white;border-bottom:1px solid #dde3ed;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.top strong{font-size:16px}.note,.muted{color:#64748b}.note{margin-left:14px}.shell{display:grid;grid-template-columns:286px minmax(0,1fr);min-height:calc(100vh - 62px);max-width:1600px;margin:auto}.sidebar{padding:16px 12px;border-right:1px solid #dde3ed;background:white}.search{width:100%;height:34px;border:1px solid #d7deea;border-radius:5px;padding:0 10px;margin-bottom:12px}.navbtn{width:100%;text-align:left;border:0;display:block;background:transparent;border-radius:4px}.family{font-weight:600;margin-top:8px;display:flex;justify-content:space-between;align-items:center}.leaf{padding-left:28px;color:#64748b}.active{background:#edf2ff!important;color:#2855db}.content{padding:24px;min-width:0}h1{font-size:22px;margin:0 0 8px}h2{font-size:15px;margin:0 0 14px}h3{font-size:13px;margin:0 0 8px}p{line-height:1.8}.sub{display:flex;justify-content:space-between;align-items:start;gap:16px;margin-bottom:24px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.badge{background:#f0f3f7;border-radius:4px;padding:4px 8px;color:#64748b}.badge.blue{background:#eaf0ff;color:#2855db}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}.card{border:1px solid #dde3ed;border-radius:8px;overflow:hidden;background:white;text-align:left;padding:0}.card:hover{border-color:#91abf7}.card .info{padding:16px}.card h3{font-size:14px}.card p{margin:6px 0;color:#64748b}.preview{background:#edf1f7;padding:18px;min-height:164px}.canvas{background:white;border:1px solid #dce3ee;box-shadow:0 3px 12px #1e293b0d;border-radius:5px;overflow:hidden}.bar{padding:10px;border-bottom:1px solid #e2e8f0;display:flex;gap:7px;align-items:center}.line{background:#eef2f8;height:9px;border-radius:2px;flex:1}.bluebox{background:#3568ff;border-radius:3px;width:35px;height:17px}.mockbody{display:flex;min-height:84px}.mocktree{width:25%;border-right:1px solid #e2e8f0;padding:10px}.mocktree span{display:block;background:#edf2ff;height:9px;margin:8px 0}.mockrows{padding:8px;flex:1}.mockrow{display:flex;gap:12px;padding:7px;border-bottom:1px solid #edf1f7}.mockrow span{height:7px;background:#e5eaf2;flex:1}.caption{text-align:right;margin-top:8px;font-size:11px;color:#94a3b8}.detail{background:white;border:1px solid #dde3ed;border-radius:8px;overflow:hidden}.heading{padding:24px;border-bottom:1px solid #e2e8f0}.breadcrumb{color:#64748b;margin-bottom:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.section{padding:24px;border-bottom:1px solid #edf1f7}.section:last-child{border:0}.section .preview{max-width:800px;border-radius:6px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:28px}ul,ol{padding-left:20px;line-height:2}.callout{padding:12px 16px;background:#f5f7fb;border-left:3px solid #94a3b8;line-height:1.8}a{color:#2855db;text-decoration:none}a:hover{text-decoration:underline}code{font-family:ui-monospace,monospace;background:#f5f7fb;padding:2px 5px}.back{border:0;padding:0;color:#2855db;margin-bottom:14px}#toast{position:fixed;bottom:20px;right:24px;background:#1e293b;color:white;border-radius:6px;padding:12px;display:none}.empty{padding:40px;text-align:center;color:#64748b}.ref{white-space:pre-wrap;line-height:1.9}.demo{max-width:1100px;margin:28px auto;background:white;border:1px solid #dde3ed;border-radius:8px;padding:24px}.demo table{width:100%;border-collapse:collapse}.demo th,.demo td{padding:12px;text-align:left;border-bottom:1px solid #e2e8f0}.demo header{margin-bottom:20px}.demo select{height:32px;font:inherit;border:1px solid #d7deea}.demo .query{display:flex;gap:10px;padding:16px;background:#f5f7fa}.demotree{width:190px;border-right:1px solid #dde3ed;padding:12px}.demogrid{display:flex}.demotree button{display:block;width:100%;text-align:left;border:0}.demodata{flex:1;padding:12px}.view-toolbar{display:flex;justify-content:space-between;padding:14px 0}@media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{max-height:250px;overflow:auto;border-bottom:1px solid #dde3ed}.content{padding:16px}.columns{grid-template-columns:1fr}.top{padding:10px 16px;height:auto}.top .note{display:none}.sub{flex-direction:column}.demogrid{display:block}.demotree{width:100%;border:0}.demo{margin:12px}.actions{gap:6px}}

:root{--showcase-muted:#7b8ba5;--ipl-primary:#3568ff}select{font:inherit;color:inherit}.page-query{margin:16px 20px;background:white;border:1px solid #dfe5ef;border-radius:8px;box-shadow:0 1px 3px #1e293b08}.record-query-fields{grid-template-columns:1.6fr 1fr 1fr}.record-query-fields input,.record-query-fields select{height:34px;padding:0 10px;border:1px solid #cbd5e1;border-radius:5px;background:white}.shell.tree-workspace{max-width:none;margin:0 20px 20px;min-height:560px;height:calc(100vh - 180px);grid-template-columns:var(--tree-width,320px) minmax(0,1fr)}.shell.tree-workspace.is-collapsed{grid-template-columns:24px minmax(0,1fr)}.sidebar.tw-panel{padding:0}.sidebar .tw-tree{padding-bottom:12px}.tw-row .tw-node{font-weight:400}.tw-row[data-family] .tw-node{font-weight:500}.content.tw-detail{padding:20px}.detail{border:0;border-radius:0}.detail .heading{padding:0 0 20px}.detail .section{padding:20px 0}.sub{margin-bottom:16px}.tree-workspace.is-collapsed .tw-toolbar,.tree-workspace.is-collapsed .tw-tools,.tree-workspace.is-collapsed .tw-tree,.tree-workspace.is-collapsed .tw-footer{display:none}.tree-workspace .tw-tools[hidden]{display:none}.tree-workspace .tw-panel-toggle{color:#64748b}.tree-workspace .tw-row:focus-visible{outline:2px solid #3568ff;outline-offset:-2px}@media(max-width:980px){.record-query-fields{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.page-query{margin:12px}.record-query-fields{grid-template-columns:1fr}.shell.tree-workspace{margin:0 12px 12px;grid-template-columns:1fr;height:auto}.sidebar.tw-panel{max-height:none;overflow:visible;height:300px}.shell.tree-workspace.is-collapsed{grid-template-columns:24px minmax(0,1fr)}.shell.tree-workspace.is-collapsed .tw-panel{height:auto}.content.tw-detail{padding:16px}.columns{grid-template-columns:1fr}}
</style><div id="shell"></div><form id="query-form"></form><script>const $=id=>document.getElementById(id);const items=[{id:'TPL-01-02',name:'带表格视图的列表',demo:true},{id:'TPL-02-01',name:'树状分类明细',demo:true}];const demo=new URLSearchParams(location.search).get('template');if(demo){const t=items.find(t=>t.id===demo);if(t?.demo){$('shell').style.display='none';$('query-form').style.display='none';const tree=t.name.includes('树');document.body.insertAdjacentHTML('beforeend',`<main class="demo"><header><h1>${t.name}</h1><p class="muted">示例交互原型 · 内存示例数据 · 不连接业务接口</p></header><div class="query"><input id="demoquery" class="search" style="margin:0" aria-label="搜索名称" placeholder="搜索名称"><button id="demo-search">查询</button><button id="demo-reset">重置</button></div><div class="demogrid">${tree?'<aside class="demotree"><button data-cat="全部">全部分类</button><button data-cat="电子类">电子类</button><button data-cat="结构类">结构类</button></aside>':''}<section class="demodata"><div class="view-toolbar"><strong id="demotitle">全部记录</strong>${!tree?'<label>当前视图 <select id="demoview"><option>默认视图</option><option>精简视图</option></select></label>':''}</div><table><thead><tr><th>编码</th><th>名称</th><th class="extra">分类</th></tr></thead><tbody id="demorows"></tbody></table><p id="democount" class="muted"></p></section></div></main>`);let cat='全部';const rows=[{code:'D001',name:'控制板',category:'电子类'},{code:'D002',name:'电源板',category:'电子类'},{code:'D003',name:'外壳',category:'结构类'}];function draw(){const q=$('demoquery').value;const shown=rows.filter(r=>(cat==='全部'||r.category===cat)&&r.name.includes(q));$('demorows').innerHTML=shown.map(r=>`<tr><td>${r.code}</td><td>${r.name}</td><td class="extra">${r.category}</td></tr>`).join('');$('demotitle').textContent=cat+'记录';$('democount').textContent='共 '+shown.length+' 条';if(!tree&&$('demoview').value==='精简视图')document.querySelectorAll('.extra').forEach(x=>x.style.display='none');else document.querySelectorAll('.extra').forEach(x=>x.style.display='')}document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;draw()});$('demo-search').onclick=draw;$('demo-reset').onclick=()=>{$('demoquery').value='';cat='全部';draw()};if(!tree)$('demoview').onchange=draw;draw();}}
</script></html>

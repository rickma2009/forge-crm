# Keep the pre-rename Compose project identity so Forge CRM reuses the existing
# PostgreSQL container and named volume instead of silently creating an empty DB.
name: interaction-pattern-lab

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interaction_pattern_lab
      POSTGRES_USER: interaction_pattern_lab
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interaction_pattern_lab -d interaction_pattern_lab"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - interaction-pattern-lab-postgres:/var/lib/postgresql/data

volumes:
  interaction-pattern-lab-postgres:

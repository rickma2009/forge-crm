<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>记录管理工作区案例</title><link rel="stylesheet" href="../../templates/ui/record-management-workspace/record-workspace.tokens.css"><link rel="stylesheet" href="styles.css"></head><body>
<div class="demo-shell">
  <nav class="tabs" aria-label="工作区页签"><button class="tab fixed" data-view="home">▦ CRM 工作台</button><div data-tabs></div></nav>
  <main>
    <section class="view" data-page="home"><h1>CRM 工作台</h1><p>从记录列表开始演示。</p><button class="primary" data-open="list">打开记录管理</button></section>
    <section class="view" data-page="list" hidden><header><h1>记录管理</h1><p>查询并浏览当前权限范围内的记录</p></header><div class="panel query"><strong>查询条件</strong><label>记录名称 <input data-query placeholder="请输入记录名称"></label><button class="primary" data-search>查询</button><button data-reset>重置</button></div><div class="panel"><div class="command"><span><strong>记录列表</strong>　<small data-count>共 2 条</small></span><button class="primary" data-open="create">＋ 新增记录</button></div><table><thead><tr><th>序号</th><th>记录编号</th><th>记录名称</th><th>负责人</th><th>创建时间</th></tr></thead><tbody data-rows><tr><td>1</td><td><button class="link" data-open="detail" aria-label="查看记录 R-001" title="查看记录 R-001">R-001</button></td><td>华南示例客户</td><td>销售甲</td><td>2026-08-29</td></tr><tr><td>2</td><td><button class="link" data-open="detail" aria-label="查看记录 R-002" title="查看记录 R-002">R-002</button></td><td>华东示例客户</td><td>销售乙</td><td>2026-08-28</td></tr></tbody></table></div></section>
    <section class="view" data-page="create" hidden><button class="link" data-open="list">← 返回列表</button><header><h1>新增记录</h1><p>负责人由系统自动确定</p></header><div class="panel form"><div class="section-head"><strong>基本信息</strong><small>记录名称为必填项</small></div><div class="grid"><label>记录名称<input value="示例记录"></label><label>简称<input></label><label>负责人<input value="当前用户" readonly></label><label>分类<input></label></div></div><div class="panel form"><div class="section-head"><strong>补充信息</strong></div><label>备注<textarea rows="4"></textarea></label></div><footer><button data-open="list">取消</button><button class="primary" data-open="detail">保存记录</button></footer></section>
    <section class="view" data-page="detail" hidden><button class="link" data-open="list">← 返回列表</button><header><h1>华南示例客户</h1><p>客户 ID：REC-001　负责人：销售甲</p></header><div class="panel form"><div class="section-head"><strong>基本信息</strong></div><dl><dt>记录名称</dt><dd>华南示例客户</dd><dt>简称</dt><dd>华南客户</dd><dt>负责人</dt><dd>销售甲</dd></dl></div><div class="panel form"><div class="section-head"><strong>补充信息</strong></div><dl><dt>备注</dt><dd>示例详情内容</dd><dt>更新时间</dt><dd>2026-08-29</dd></dl></div></section>
  </main>
</div><script src="app.js"></script></body></html>
